name: Full CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-scan-push-deploy:
    name: Build, Scan, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run tests
      - name: Run tests
        run: npm test || echo "⚠️ No tests found, skipping..."

      # Step 5: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 6: Log in to DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 7: Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/zees-app:latest .

      # Step 8: Run Trivy scan
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.21.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/zees-app:latest
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'

      # Step 9: Push Docker image
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/zees-app:latest

      # Step 10: Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Stop and remove old container (if any)
            docker stop zees-web || true
            docker rm zees-web || true

            # Pull latest image from Docker Hub
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/zees-app:latest

            # Restart MongoDB if not running
            docker ps | grep mongo || docker run -d --name mongo -p 27017:27017 mongo:6

            # Run new version of the app
            docker run -d --name zees-web -p 5000:5000 \
              -e PORT=5000 \
              -e MONGO_URI=mongodb://mongo:27017/zeesdb \
              -e JWT_SECRET=sup3rS3cr3tT0kenKey123! \
              --link mongo:mongo \
              ${{ secrets.DOCKERHUB_USERNAME }}/zees-app:latest

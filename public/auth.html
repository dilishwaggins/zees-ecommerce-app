<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Zee's Shop - Login/Register</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; }
    header { display:flex; justify-content:space-between; margin-bottom:20px; }
    nav button { margin-left:10px; padding:6px 12px; }
    .auth-container { display:flex; justify-content:space-around; margin-top:20px; }
    .auth-box { border:1px solid #ddd; padding:20px; width:40%; }
    input { display:block; margin:8px 0; padding:6px; width:90%; }
    button { padding:6px 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Zee's Shop</h1>
    <nav>
      <button onclick="window.location='index.html'">Shop</button>
      <button onclick="window.location='auth.html'">Login/Register</button>
    </nav>
  </header>

  <div class="auth-container">
    <!-- Register -->
    <div class="auth-box">
      <h3>Register</h3>
      <input id="regName" placeholder="name" />
      <input id="regEmail" placeholder="email" />
      <input id="regPassword" placeholder="password" type="password" />
      <button id="btnRegister">Register</button>
    </div>

    <!-- Login -->
    <div class="auth-box">
      <h3>Login</h3>
      <input id="loginEmail" placeholder="email" />
      <input id="loginPassword" placeholder="password" type="password" />
      <button id="btnLogin">Login</button>
      <div id="who"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

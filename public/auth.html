<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Zee's Shop - Login/Register</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 20px auto;
      background: url("images/leopard-1.jpeg") no-repeat center center fixed;
      background-size: cover;
      color: #f4b9d3; /* pastel pink text */
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    nav button {
      margin-left: 10px;
      padding: 6px 12px;
      background: #f4b9d3;
      color: black;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .auth-container {
      display: flex;
      justify-content: space-around;
      gap: 20px;
      margin-top: 40px;
    }

    .auth-box {
      flex: 1;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 20px;
      border-radius: 8px;
      background: rgba(0,0,0,0.6);
      color: #fff;
    }

    .auth-box h3 {
      color: #f4b9d3;
      margin-bottom: 15px;
    }

    input {
      display: block;
      margin: 10px 0;
      padding: 8px;
      width: 90%;
      border: none;
      border-radius: 4px;
    }

    button {
      padding: 8px 12px;
      background: #f4b9d3;
      color: black;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #who {
      margin-top: 10px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <header>
    <h1>Zee's Shop</h1>
    <nav>
      <button onclick="window.location='index.html'">Shop</button>
      <button onclick="window.location='auth.html'">Login/Register</button>
    </nav>
  </header>

  <div class="auth-container">
    <!-- Register -->
    <div class="auth-box">
      <h3>Register</h3>
      <input id="regName" placeholder="Name" />
      <input id="regEmail" placeholder="Email" />
      <input id="regPassword" placeholder="Password" type="password" />
      <button id="btnRegister">Register</button>
    </div>

    <!-- Login -->
    <div class="auth-box">
      <h3>Login</h3>
      <input id="loginEmail" placeholder="Email" />
      <input id="loginPassword" placeholder="Password" type="password" />
      <button id="btnLogin">Login</button>
      <div id="who"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

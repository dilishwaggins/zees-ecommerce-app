<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Zee's Shop (Demo)</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: 20px auto;
      background: url("images/leopard-1.jpeg") no-repeat center center fixed;
      background-size: cover;
      color: #f4b9d3; /* pastel pink text */
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    nav button {
      margin-left: 10px;
      padding: 6px 12px;
      background: #f4b9d3;
      color: black;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Products grid */
    #products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }

    .product {
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 15px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      text-align: center;
    }

    .product img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .product h3 {
      margin: 8px 0;
      color: #fff;
    }

    .product p {
      margin: 4px 0;
    }

    button {
      padding: 6px 10px;
      background: #f4b9d3;
      color: black;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Cart */
    #cart {
      margin-top: 10px;
      padding: 10px;
      background: rgba(0,0,0,0.6);
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Zee's Shop</h1>
    <nav>
      <button onclick="window.location='index.html'">Shop</button>
      <button onclick="window.location='auth.html'">Login/Register</button>
    </nav>
  </header>

  <main>
    <section>
      <h2>Products</h2>
      <div id="products"></div>
    </section>

    <section>
      <h2>Your Cart</h2>
      <div id="cart">Cart is empty</div>
      <button id="btnCheckout">Checkout</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>

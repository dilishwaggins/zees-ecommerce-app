<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Zee's Shop (demo)</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; }
    .product { border: 1px solid #ddd; padding: 10px; margin: 8px 0; display:flex; justify-content:space-between; }
    button { padding:6px 10px; }
    #login, #register { margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>Zee's Shop (Demo)</h1>

  <div id="auth">
    <div id="register">
      <h3>Register</h3>
      <input id="regName" placeholder="name" />
      <input id="regEmail" placeholder="email" />
      <input id="regPassword" placeholder="password" type="password" />
      <button id="btnRegister">Register</button>
    </div>

    <div id="login">
      <h3>Login</h3>
      <input id="loginEmail" placeholder="email" />
      <input id="loginPassword" placeholder="password" type="password" />
      <button id="btnLogin">Login</button>
      <button id="btnLogout">Logout</button>
      <div id="who">Not logged in</div>
    </div>
  </div>

  <h2>Products</h2>
  <div id="products"></div>

  <h2>Your Cart</h2>
  <div id="cart">Cart is empty</div>
  <button id="btnCheckout">Checkout</button>

  <script src="app.js"></script>
</body>
</html>
